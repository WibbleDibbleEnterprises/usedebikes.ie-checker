name: usedebikes Checker

on:
  # Scheduled runs via GitHub's own cron are disabled because they are unreliable.
  # This workflow is triggered externally every 2 minutes by cron-job.org instead.
  # schedule:
  #   - cron: "*/2 * * * *"
  workflow_dispatch:
    # Triggered by cron-job.org, and also allows manual runs from GitHub

jobs:
  check-listings:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Random jitter delay
        run: sleep $((RANDOM % 60))

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run the listing checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checker.py

      - name: Save updated state back to the repo
        run: |
          git config user.name "listing-bot"
          git config user.email "listing-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
